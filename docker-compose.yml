services:
  db:
    image: postgres:16
    container_name: munassiq-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: munassiq_owner
      POSTGRES_PASSWORD: change-me-owner
      POSTGRES_DB: munassiq
      APP_DB_PASSWORD: change-me-app
      SYSTEM_DB_PASSWORD: change-me-system
    volumes:
      - munassiq_pg:/var/lib/postgresql/data
      - ./db/bootstrap-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munassiq_owner -d munassiq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  munassiq_pg:
