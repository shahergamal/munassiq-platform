# Behind Cloudflare the visitor's address is CF-Connecting-IP; otherwise what the proxy in front of us saw.
map $http_cf_connecting_ip $client_ip {
  ""      $proxy_add_x_forwarded_for;
  default $http_cf_connecting_ip;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 3m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # The assistant streams its answer.
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Built files carry a content hash: cache them for a year. index.html never.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
